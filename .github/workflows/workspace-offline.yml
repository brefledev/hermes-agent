name: Workspace offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded offline-test dependencies
        run: |
          python -m venv .venv
          python -m pip --python .venv install -r .gnosis/requirements.txt
      - name: Check subprocess failure propagation
        run: node --test scripts/workspace-exit-code.test.mjs
      - name: Run offline workspace subset
        run: node scripts/verify-workspace-offline.mjs
